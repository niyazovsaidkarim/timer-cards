<!DOCTYPE html>
<html lang="en"><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>Sokin Focus</title><style>
:root{--bg:#f6f4ee;--ink:#252923;--muted:#808477;--green:#52705b;--line:#e5e6dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:22px;padding:15px 20px;background:#e9ebe2;color:var(--ink);min-height:48px}button:disabled{opacity:.4}button:focus-visible,input:focus-visible{outline:3px solid #92ac81}header{display:flex;align-items:center;justify-content:space-between;margin:28px 24px}.logo{background:var(--ink);color:#fff;border-radius:50%;padding:13px;font:18px Georgia}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}main{max-width:650px;margin:auto;padding:0 22px 110px}h1{font:40px Georgia,serif;letter-spacing:-1.5px;margin:22px 0 10px}p{color:var(--muted);line-height:1.6}h2{font-size:17px;margin:0 0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:30px;padding:24px;margin:20px 0}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.pills button{padding:12px 18px}.selected,.primary{background:var(--ink)!important;color:white!important}.primary{flex:1}.timer{text-align:center;padding:34px 18px}.time{font-size:clamp(62px,19vw,100px);font-weight:500;letter-spacing:-5px;font-variant-numeric:tabular-nums;margin:25px 0}.ring{width:100%;height:5px;border-radius:8px;background:var(--line);margin:25px 0}.ring i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .5s}.small{font-size:13px;color:var(--muted)}input{width:100%;padding:14px;border:1px solid var(--line);background:var(--bg);border-radius:16px;color:var(--ink)}label{font-size:13px;color:var(--muted);display:block;margin:14px 0 7px}.number{font-size:36px;font-weight:500;letter-spacing:-1px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0;padding:22px 16px}.barplot{display:flex;gap:9px;align-items:end;height:170px;padding-top:18px}.barcol{flex:1;text-align:center;min-width:0}.bar{background:#bccab6;border-radius:7px 7px 3px 3px;min-height:3px;margin:7px 0}.bar.today{background:var(--green)}nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;padding:10px 12px max(16px,env(safe-area-inset-bottom));gap:10px}nav button{background:none;flex:1;max-width:180px;border-radius:16px;font-size:14px}nav .active{background:#e5eadd;color:#34533b}section[hidden]{display:none}.session{padding:17px 0;border-bottom:1px solid var(--line)}.session:last-child{border:0}.date{font:24px Georgia;margin:25px 0 0}.empty{padding:30px 0;text-align:center}.badge{color:var(--green);font-size:12px}#full{position:fixed;inset:0;background:#070807;color:#fafbf7;z-index:10;display:none;flex-direction:column;justify-content:center;align-items:center;padding:24px}#full.on{display:flex}#full .time{font-size:clamp(80px,23vw,220px);letter-spacing:-5px}#full button{background:#222620;color:#dfe6da}#full .exit{position:absolute;top:24px;right:24px}#full p{color:#8f9b89}#notice{background:#e5ecdf;padding:16px;border-radius:18px;line-height:1.5;margin:16px 0}dialog{border:0;border-radius:26px;padding:25px;max-width:90%;width:360px}dialog::backdrop{background:#0008}@media (orientation:landscape){#full .time{font-size:30vh;margin:0}#full .eyebrow{margin-top:10px}}

/* Two destinations, with the timer and its primary action above setup. */
body{background:#f5f6f4;color:#14201c;font-family:Roboto,system-ui,sans-serif}
nav{position:static;background:transparent;border:0;justify-content:flex-start;max-width:600px;margin:0 auto;padding:12px 20px 4px;gap:4px}
nav button{flex:none;color:#50615b;font-size:17px;border-radius:0;border-bottom:2px solid transparent}
nav .active{color:#123b31;background:transparent;border-color:#20624e;font-weight:650}
main{max-width:600px;padding:6px 20px 30px}
h1{font:600 30px Roboto,system-ui,sans-serif;margin:16px 0}
#modes,.pills{margin:14px 0;gap:5px}
#modes button,.pills button{min-height:44px;padding:9px 13px;border-radius:12px}
.timer{position:relative;background:#152d27;color:#f9fff9;padding:32px 18px 18px;margin:10px 0;border:0;border-radius:24px}
.timer .eyebrow{color:#bfcec6;font-size:13px;letter-spacing:.5px;text-transform:none}
.timer .time{font-size:clamp(62px,19vw,105px);font-weight:550;margin:18px 0}
.timer .ring{background:#3d534a;margin:18px 0;height:4px}.timer .ring i{background:#c4edac}
.timer .primary{background:#c4edac!important;color:#142d20!important;font-weight:650}
.timer #expand{color:#dce8e1;margin:2px 0 0!important;padding:8px}
#presets{display:grid;grid-template-columns:repeat(4,1fr)}#presets button{padding:8px 2px}
#focus:has(#stop:not([hidden])) #presets,#focus:has(#stop:not([hidden])) #modes{display:none}
.card{border-radius:20px}.grid .number{font-size:27px}.barplot{height:140px}
#progress .card{margin:12px 0}#progress .grid .card{margin:0}
#task{background:white}#notice{margin:10px 0}
@media(max-height:550px){.timer{padding:10px}.timer .time{margin:3px 0}.timer .ring{margin:6px 0}}

#full {background:#050505;color:white;padding:0;overflow:hidden}
#fullStatus,#fullTask {display:none}
#full #fullClock {
  margin:0;color:white;font-family:sans-serif-condensed,"Roboto Condensed",Roboto,sans-serif;
  font-weight:900;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums;
  font-size:min(37vw,72vh);transform:scaleX(.82);white-space:nowrap;
}
#full #fullClock.long {font-size:min(31vw,72vh)}
#full button {position:absolute;z-index:1;visibility:hidden}
#full.controls button {visibility:visible}
#fullPause {bottom:12px}
#full .exit {top:12px;right:12px}

body {background:#f6f5f1;color:#17221e}
main {max-width:510px;margin:auto;padding:16px 20px 95px}
nav {position:fixed;inset:auto 0 0;z-index:5;background:#fcfcf9;border-top:1px solid #d9ddd6;
  margin:auto;max-width:none;padding:6px 16px;justify-content:center;gap:8px}
nav button,nav button.active {flex:1;max-width:200px;border:0;border-radius:12px;font-size:15px}
nav button.active {background:#e0e9df;color:#214b39}
h1 {font-size:32px;letter-spacing:-1.3px;margin:6px 0 18px}
#modes,#progress>.pills {display:inline-flex;background:#e6e7e1;border-radius:15px;padding:4px;margin:0}
#modes button,#progress>.pills button {border-radius:11px;background:transparent;min-width:86px}
#modes .selected,#progress>.pills .selected {background:#fff!important;color:#193f30!important;box-shadow:0 1px 4px #0002}
#focus .timer {background:#fff;color:#17221e;border:1px solid #dedfd7;padding:26px 18px 8px;margin:16px 0;border-radius:24px}
.timer .eyebrow {color:#53655c}.timer .time {font-size:clamp(70px,21vw,100px);letter-spacing:-.065em;color:#1b392e;margin:10px 0}
.timer .ring {height:3px;background:#e6ece5;margin:16px 0}.timer .ring i {background:#376c53}
.timer .primary {background:#204c39!important;color:white!important;border-radius:14px}
.timer #expand {color:#435d50}
#presets {margin:16px 0 20px}#presets button {font-size:14px;background:#f0f2ed}
#presets .selected {background:#dfebdf!important;color:#1d4633!important}
label[for=task]{display:flex;justify-content:space-between;color:#273c31;font-weight:600}
label small{font-weight:400;color:#687568}
#progress>.between {margin:12px 0 0}
#progress>.between button,#goalEdit {background:transparent;color:#35553e}
#progress .card {padding:18px;background:#fff}
#progress .barplot {height:122px;border-bottom:1px solid #e0e5dc}
.bar {min-height:0}.grid .card .number {font-size:25px}
#progress .number,#goalText {font-variant-numeric:tabular-nums}
#full {z-index:12;background:#000}
#full #fullClock {font-size:min(42vw,78vh);transform:scaleX(.84)}
#full #fullClock.long {font-size:min(34vw,77vh)}
details summary{cursor:pointer;padding:14px 0;color:#345941}#recentSubjects button{margin:4px;padding:8px 14px}#subjectTotals .row{padding:6px 0}#endDialog .row{flex-wrap:wrap}</style><body><nav><button class="active" data-page="focus">Focus</button><button data-page="progress">Results</button></nav><main>
<section id="focus"><h1>Focus timer</h1><div class="pills" id="modes"><button class="selected" data-mode="focus">Study</button><button data-mode="break">Break</button></div><div class="card timer"><div class="eyebrow" id="status">Ready to focus</div><div class="time" id="clock">25:00</div><div class="ring"><i id="fill" style="width:0"></i></div><div class="pills" id="presets"><button data-min="25">25 min</button><button data-min="45">45 min</button><button data-min="60">60 min</button><button id="custom">Custom</button></div><div class="row"><button class="primary" id="start">Start</button><button hidden="" id="stop">Finish</button></div><button hidden id="expand" style="background:none;margin-top:15px">Full screen</button></div><div hidden="" id="notice"></div><details id="subjects"><summary>+ Subject</summary><div id="recentSubjects"></div><input aria-label="Session name" autocomplete="off" id="task" maxlength="80" placeholder="e.g. IELTS Reading"/></details></section>
<section hidden="" id="progress"><h1>Results</h1><div class="pills"><button class="selected" id="dayBtn">Day</button><button id="weekBtn">Week</button></div><div class="row between"><button aria-label="Previous period" id="prev">←</button><span class="small" id="periodLabel"></span><button aria-label="Next period" id="next">→</button></div><div class="card"><div class="small" id="totalLabel">Focus time</div><div class="number" id="periodTotal"></div><div class="barplot" id="chart"></div></div><div class="card" hidden id="bySubject"><h2>By subject</h2><div id="subjectTotals"></div></div><div class="grid"><div class="card"><div class="small">Finished sessions</div><div class="number" id="sessionsCount"></div></div><div class="card"><div class="small">Longest session</div><div class="number" id="longest"></div></div></div><div class="card"><div class="row between"><h2>Today’s goal</h2><button id="goalEdit">Edit</button></div><div id="goalText"></div><div class="ring"><i id="goalFill"></i></div></div></section>

</main>
<div id="full"><button class="exit" id="collapse">Finish</button><div class="eyebrow" id="fullStatus">Focus</div><div class="time" id="fullClock">25:00</div><p id="fullTask"></p><button id="fullPause">Start</button></div>
<dialog id="numberDialog"><h2 id="dialogTitle"></h2><input id="minutes" inputmode="numeric" max="720" min="1" type="number"/><p class="small" id="validation"></p><div class="row"><button id="cancelDialog">Cancel</button><button class="primary" id="saveDialog">Save</button></div></dialog>
<dialog id="endDialog"><h2>Finish this session?</h2><p>Your study time so far will count toward your results.</p><div class="row"><button id="cancelEnd">Keep going</button><button id="discard">Discard</button><button class="primary" id="confirmEnd">Finish</button></div></dialog>
<script src="engine.js"></script><script src="app.js"></script></body></html>
